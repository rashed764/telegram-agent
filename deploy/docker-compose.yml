version: '3.8'

services:
  telegram-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: telegram_autonomous_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
